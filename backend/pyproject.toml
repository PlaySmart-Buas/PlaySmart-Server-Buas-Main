[tool.poetry]
name = "Packages"
version = "0.1.0"
description = "Enhancing Performance for the Breda Guardians through Data Analytics"
authors = []
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.9,<3.11"

# ---- Actually used by the backend (confirmed via grep) ----
pandas = "2.1.3"
numpy = "1.26.2"
paramiko = "^3.5.0"

# ---- Backend API requirements ----
fastapi = "0.104.1"
uvicorn = { version = "0.24.0", extras = ["standard"] }
python-jose = { version = "3.3.0", extras = ["cryptography"] }
passlib = { version = "1.7.4", extras = ["bcrypt"] }
python-multipart = "0.0.6"
pydantic = { version = "1.10.8", extras = ["email"] }
email-validator = "2.0.0"
bcrypt = "4.0.1"
httpx = "0.28.1"
python-dotenv = "^1.2.1"
sqlalchemy = "2.0.23"
psycopg2-binary = "^2.9.10"

[tool.poetry.group.dev.dependencies]
pytest = "*"
flake8 = "*"
ipykernel = "^6.29.5"